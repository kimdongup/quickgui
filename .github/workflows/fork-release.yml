name: Fork release archives

on:
  push:
    branches: ['personal/release-ops']
    tags: ['fork-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork tag (leave empty for a build-only run)
        type: string
        default: ''
      publish:
        description: Publish a draft prerelease from the existing tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'kimdongup/quickgui'
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/fork-v') || inputs.publish == true }}
        run: python3 tool/fork_release.py prepare

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y clang cmake libblkid1 liblzma5 libgtk-3-dev ninja-build pkg-config
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - if: runner.os == 'Linux'
        run: flutter build linux --release
      - if: runner.os == 'macOS'
        run: flutter build macos --release
      - env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tool/fork_release.py package
      - uses: actions/upload-artifact@v7
        with:
          name: fork-${{ runner.os }}
          path: dist/fork/*
          if-no-files-found: error

  collect:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: fork-*
          merge-multiple: true
          path: dist/fork
      - env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 tool/fork_release.py manifest
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-candidate
          path: dist/fork/*
          if-no-files-found: error
      - name: Create a draft prerelease only when explicitly requested
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/fork/* --verify-tag --draft --prerelease --generate-notes
